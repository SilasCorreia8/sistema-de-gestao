<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Vendas Web</title>
    <style>
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        body {
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        form { text-align: left; }

        label {
            display: block;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-login {
            background-color: #3498db;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-login:hover { opacity: 0.9; }
        
        .error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="login-box">
        <h2>Acesso ao Sistema</h2>
        <p>Informe suas credenciais para continuar.</p>
        
        <form method="post">
            {% csrf_token %}
            
            <label>Usuário</label>
            {{ form.username }}
            
            <label>Senha</label>
            {{ form.password }}
            
            {% if form.errors %}
                <div class="error">Nome de usuário ou senha incorretos.</div>
            {% endif %}

            <button type="submit" class="btn-login">Entrar no ERP</button>
        </form>
    </div>

</body>
</html>
