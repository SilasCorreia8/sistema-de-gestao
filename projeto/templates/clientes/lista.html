{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Lista de Clientes</h1>
    <a href="{% url 'criar-clientes' %}" class="btn btn-success">
        Novo Cliente
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Data</th>
                    <th>Telefone</th>
                </tr>
            </thead>
            <tbody>
                {% for c in clientes %}
                <tr>
                    <td>{{ c.nome }}</td>
                    <td>{{ c.email }}</td>
                    <td>{{ c.data }}</td>
                    <td>{{ c.telefone }}</td>
                </tr>
                <tr>
                    <td class="text-end">
                        <a href="{% url 'editar-clientes' c.pk %}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="{% url 'excluir-clientes' c.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">Nenhum cliente cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
