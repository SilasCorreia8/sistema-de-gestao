{% extends 'base.html' %}

{% block content %}
    <div style="text-align: center;">
        <h2 style="color: var(--danger);">Cuidado!</h2>
        <p>Você tem certeza que deseja remover o registro:</p>
        
        <div style="background: #eee; padding: 20px; margin: 20px 0; border-radius: 5px;">
            <h3>{{ object.nome }}</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger" style="width: 100%;">Sim, Excluir Definitivamente</button>
        </form>
        
        <br>
        <a href="{% url 'lista-fornecedores' %}">Não, voltar para lista</a>
    </div>
{% endblock %}
