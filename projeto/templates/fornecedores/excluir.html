{% extends 'base.html' %}

{% block content %}
<div style="text-align: center;">
    <h2 style="color: var(--danger);">Cuidado!</h2>
    <p>Você tem certeza que deseja remover o registro:</p>
        
    <div style="background: #eee; padding: 20px; margin: 20px 0; border-radius: 5px;">
        <h3>{{ object.nome }}</h3>
    </div>

    <p style="margin-bottom: 20px; color: #7f8c8d;">Esta ação apagará os dados permanentemente.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Sim, Excluir Definitivamente</button>
    </form>

    <div class="mt-3">
        <button type="button" class="btn w-100" style="background-color: #bdc3c7; color: var(--dark);" onclick="history.back()">
            Não, Cancelar
        </button>
    </div>
</div>
{% endblock %}
