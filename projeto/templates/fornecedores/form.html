{% extends 'base.html' %}

{% block content %}
<div class="d-flex">
    <h2>Cadastro / Edição</h2>
</div>
    
<form method="post">
    {% csrf_token %}
    
    {{ form.as_p }}
    
    <div class="mt-3">
        <button type="submit" class="btn btn-success w-100">Salvar Dados</button>
        
        <button type="button" class="btn w-100 mt-3" style="background-color: #7f8c8d;" onclick="history.back()">
            Cancelar e Voltar
        </button>
    </div>
</form>
{% endblock %}
