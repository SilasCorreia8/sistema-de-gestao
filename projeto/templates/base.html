<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Web de Gestão</title>
    
    <style>
        :root {
            --primary: #2c3e50;  /* Azul Escuro (Menu e Títulos) */
            --accent: #3498db;   /* Azul Claro (Botões e Destaques) */
            --danger: #e74c3c;   /* Vermelho (Excluir e Alertas) */
            --success: #27ae60;  /* Verde (Salvar e Novos Registros) */
            --light: #ecf0f1;    /* Cinza Claro (Fundo do site) */
            --white: #ffffff;    /* Branco (Fundo das caixas) */
            --dark: #333333;     /* Quase preto (Textos) */
            --border: #bdc3c7;   /* Cor suave para bordas */
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* MENU DE NAVEGAÇÃO (Navbar) */
        .navbar {
            background-color: var(--primary);
            padding: 1rem 5%; /* Espaçamento fluido */
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Sombra */
        }

        .navbar-brand {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none; 
            margin-left: 10px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background 0.3s ease; /* Efeito suave */
        }

        .nav-links a:hover {
            background-color: var(--accent); /* Acende ao passar o mouse */
        }
        
        /* CONTEÚDO PRINCIPAL (A "Folha" Branca) */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Sombra  suave */
        }

        /* TABELAS */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary); 
            color: var(--white); 
            text-align: left; 
            padding: 15px; 
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid var(--border); 
        }

        tr:hover { 
            background-color: #f9f9f9; /* Destaca a linha inteira */
        } 

        /* FORMULÁRIOS */
        form p { 
            margin-bottom: 15px; 
        } 
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }

        /* Estiliza automaticamente TODOS os tipos de inputs do Django */
        input[type="text"], input[type="email"], input[type="number"], 
        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.4);
        }

        /* BOTÕES */
        .btn, button, input[type="submit"] {
            display: inline-block;
            background-color: var(--accent);
            color: var(--white);
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: opacity 0.3s, transform 0.1s;
        }
        
        .btn:hover, button:hover, input[type="submit"]:hover { 
            opacity: 0.9; 
            transform: translateY(-1px); /* Botão "sobe" 1 pixel ao passar o mouse */
        }
        
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }

        /* UTILITÁRIOS (Classes auxiliares para organizar o layout) */
        .d-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light);
        }

        .text-center { text-align: center; }
        .mt-3 { margin-top: 20px; }
        .w-100 { width: 100%; }
        
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="navbar-brand">Sistema Web</a>
        <div class="nav-links">
            <a href="{% url 'lista-clientes' %}">Clientes</a>
            <a href="{% url 'lista-produtos' %}">Produtos</a>
            <a href="{% url 'lista-fornecedores' %}">Fornecedores</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
