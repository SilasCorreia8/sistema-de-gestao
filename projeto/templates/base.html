<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Web</title>
    <style>
        :root {
            --primary: #2c3e50;  
            --accent: #3498db;   
            --danger: #e74c3c; 
            --light: #ecf0f1;    
            --white: #ffffff;
            --dark: #333333;
        }

        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Layout */
        .navbar {
            background-color: var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--white);
        }

        .navbar a {
            color: var(--white);
            text-decoration: none; 
            margin-left: 20px;
            font-weight: bold; }
        
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Tabelas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary); 
            color: var(--white); 
            text-align: left; 
            padding: 12px; }

        td { 
            padding: 12px; 
            border-bottom: 1px solid #ddd; 
        }

        tr:hover { 
            background-color: #f1f1f1; 
        } 

        /* Formulários */
        form p { 
            margin-bottom: 15px; 
        } 
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Input pega a largura total */
        input[type="text"], input[type="email"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Botões */
        .btn, button, input[type="submit"] {
            display: inline-block;
            background-color: var(--accent);
            color: var(--white);
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
            transition: background 0.3s;
        }
        
        .btn:hover, button:hover { 
            opacity: 0.9; 
        }
        
        /* Cores específicas */
        .btn-danger { 
            background-color: var(--danger); 
        }

        .btn-new { 
            display: block; 
            width: 100%; 
            text-align: center; 
            margin-top: 20px; 
        }

        .header-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .alert { 
            padding: 15px; 
            background-color: #ffeaa7; 
            border-left: 5px solid #fdcb6e; 
            margin-bottom: 20px; 
        }
        
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 30px;">Sistema Web</div>
        <div>
            <a href="{% url 'lista-clientes' %}">Clientes</a>
            <a href="{% url 'lista-produtos' %}">Produtos</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
